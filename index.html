<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VarPad — One tweak. Every snippet.</title>
<style>
  /* Colour palettes. Each sets every token, so palette previews can scope one with data-palette. */
  :root,[data-palette="day"]{
    color-scheme:light;
    --bg:#f4f6f9; --panel:#fff; --ink:#202631; --muted:#687383; --line:#e1e6ed; --line-strong:#aab5c5; --hover:#fafbfc;
    --accent:#315fce; --accent-hover:#264fae; --accent-soft:#edf2ff; --accent-line:#dce5ff; --accent-ink:#234cae; --on-accent:#fff; --focus:#315fce35;
    --highlight:#2bc23f; --danger:#b42318; --danger-soft:#fff0ef; --code:#f5f7fa; --shadow:0 2px 10px #1822300a; --shadow-lg:0 6px 24px #1822301f;
  }
  [data-palette="midnight"]{
    color-scheme:dark;
    --bg:#0f141b; --panel:#171d26; --ink:#e6ebf2; --muted:#8b97a8; --line:#273141; --line-strong:#3a4659; --hover:#1d2430;
    --accent:#5b8def; --accent-hover:#4a7be0; --accent-soft:#1c2a45; --accent-line:#2a3d63; --accent-ink:#9dbcff; --on-accent:#fff; --focus:#5b8def55;
    --highlight:#3fdc5a; --danger:#ff6b5e; --danger-soft:#3a1d1d; --code:#11171f; --shadow:0 2px 10px #0006; --shadow-lg:0 6px 24px #0009;
  }
  [data-palette="forest"]{
    color-scheme:light;
    --bg:#f2f5f1; --panel:#fff; --ink:#1f2a22; --muted:#66756a; --line:#dde5dc; --line-strong:#a9b8a8; --hover:#f8faf7;
    --accent:#2f7d4f; --accent-hover:#256640; --accent-soft:#e8f3ec; --accent-line:#cfe5d6; --accent-ink:#22613c; --on-accent:#fff; --focus:#2f7d4f35;
    --highlight:#e8890c; --danger:#b42318; --danger-soft:#fff0ef; --code:#f4f7f3; --shadow:0 2px 10px #1822300a; --shadow-lg:0 6px 24px #1822301f;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,input,textarea{font:inherit}
  button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 11px;cursor:pointer}
  button:hover{border-color:var(--line-strong);background:var(--hover)}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
  .primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:650}
  .primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .small{padding:5px 8px;font-size:12px}
  .icon-btn{width:29px;height:29px;padding:0;display:inline-grid;place-items:center;font-size:16px;flex:0 0 auto}
  .ico{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none}
  button:not(.icon-btn) .ico{margin-right:5px}
  .delete-variable:hover,.delete-snippet:hover{color:var(--danger)}
  .app-header{padding:19px 25px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{max-width:1500px;margin:auto}
  h1{font-size:25px;letter-spacing:-.65px;margin:0 0 1px}
  .tagline{font-size:16px;font-weight:650;color:var(--highlight);margin:0 0 3px}
  .description{color:var(--muted);margin:0;font-size:13px}
  .zen-btn{font-size:18px;color:var(--accent);border-color:transparent;background:transparent}
  /* Ensō: uneven border widths taper the stroke, heaviest at the lower right once rotated; the conic mask cuts the gap between twelve and one o'clock and fades the tail into it. */
  .ico-enso{display:inline-block;width:1.2em;height:1.2em;border-radius:50%;border:solid currentColor;border-width:.12em .17em .11em .045em;transform:rotate(30deg);-webkit-mask:conic-gradient(from -35deg,transparent 0 45deg,#000 48deg 290deg,#0009 330deg,transparent 360deg);mask:conic-gradient(from -35deg,transparent 0 45deg,#000 48deg 290deg,#0009 330deg,transparent 360deg)}
  .zen-btn:hover,.zen-btn[aria-pressed="true"]{border-color:var(--line);background:var(--accent-soft)}
  /* Zen mode: only workspace switching, variable values, and snippet output remain. */
  .zen .app-header{display:none}
  .zen .side-head,.zen .drag-handle,.zen .workspace-more,.zen .delete-workspace,.zen #renameWorkspace,.zen .section-head,.zen .delete-variable,.zen .var-card .lock-btn,.zen .snippet-head,.zen .tpl-wrap,.zen .snippet-label-input,.zen .label-btn{display:none}
  .zen .var-card{grid-template-columns:minmax(0,2fr) auto minmax(0,3fr)}
  .zen .var-name:disabled{background:transparent;border-color:transparent}
  .zen .snippet{grid-template-columns:minmax(0,1fr)}
  .zen .snippet-body{gap:0}
  .layout{max-width:1500px;margin:0 auto;padding:20px 20px 45px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
  .side-col{position:sticky;top:16px;min-width:0}
  /* Same height as the workspace toolbar so the sidebar and the Variables section start level. */
  .zen-row{height:34px;margin:0 0 13px;display:flex;align-items:center}
  .sidebar{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .side-head{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
  .side-actions{display:flex;align-items:center;gap:4px}
  .side-title{display:flex;align-items:center;gap:6px;min-width:0}
  .side-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
  .workspace-list{padding:6px;display:grid;gap:3px;max-height:calc(100vh - 180px);overflow:auto}
  .workspace-row{display:flex;align-items:center;gap:2px;padding:0 4px 0 6px;border:1px solid transparent;border-radius:8px;min-width:0}
  .workspace-row:hover{background:var(--hover)}
  .workspace-row.active{background:var(--accent-soft);border-color:var(--accent-line)}
  .workspace-item{display:flex;align-items:center;gap:7px;text-align:left;flex:1;padding:8px 6px;border:0;background:transparent;min-width:0}
  .workspace-item:hover{background:transparent}
  .workspace-row.active .workspace-item{color:var(--accent-ink);font-weight:650}
  .workspace-more,.delete-workspace{width:25px;height:25px;font-size:15px;color:var(--muted);border-color:transparent;background:transparent}
  .workspace-more:hover,.workspace-more[aria-expanded="true"],.delete-workspace:hover{border-color:var(--line);background:var(--panel);color:var(--ink)}
  .delete-workspace:hover{color:var(--danger)}
  .menu{position:fixed;z-index:6;min-width:170px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg)}
  .menu button{display:flex;align-items:center;width:100%;padding:7px 9px;border:0;border-radius:6px;background:transparent;text-align:left}
  .menu button:hover,.menu button:focus-visible{background:var(--accent-soft);outline:none}
  .suggest{max-height:220px;overflow:auto;min-width:210px;max-width:360px}
  .suggest button{justify-content:space-between;gap:14px;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .suggest button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
  .suggest-value{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .workspace-item .workspace-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .main{min-width:0}
  .workspace-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:34px;margin:0 0 13px}
  .workspace-title-wrap{min-width:0;display:flex;align-items:center;gap:9px}
  .workspace-title{font-size:20px;font-weight:700;letter-spacing:-.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rename-form{display:flex;align-items:center;gap:7px;flex:1;min-width:0;max-width:640px}
  .rename-form input{font-size:16px;font-weight:650;padding:6px 9px}
  .section{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden}
  .section-head{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
  h3{font-size:14px;margin:0}
  .hint{color:var(--muted);font-size:12px;margin:2px 0 0}
  .section-body{padding:12px 14px 14px}
  .variables{display:grid;gap:8px}
  .var-card{display:grid;grid-template-columns:auto auto auto minmax(0,2fr) auto minmax(0,3fr);align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px;min-width:0;background:var(--panel)}
  .var-eq{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field-label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.045em;margin:0 0 4px}
  input,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--panel);color:var(--ink)}
  .var-name{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 7px}
  .var-name:disabled,textarea:disabled{background:var(--code);color:var(--ink);-webkit-text-fill-color:var(--ink)}
  .var-card .icon-btn,.snippet-head .icon-btn,.title-edit,.label-btn,.settings-btn{width:25px;height:25px;font-size:15px;color:var(--muted);border-color:transparent;background:transparent}
  .settings-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .var-card .icon-btn:hover,.snippet-head .icon-btn:hover,.title-edit:hover,.label-btn:hover{border-color:var(--line);background:var(--hover)}
  .var-value{font-size:12px;padding:6px 7px}
  .snippets{display:grid;gap:9px}
  .snippet{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .snippet-main{padding:10px 11px;min-width:0}
  .drag-handle{display:grid;place-items:center;color:var(--muted);cursor:grab;font-size:15px}
  .drag-handle:hover{color:var(--ink)}
  .snippet>.drag-handle{width:22px;background:var(--code);border-right:1px solid var(--line)}
  .dragging{opacity:.45}
  .snippet-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .snippet-desc{display:flex;align-items:center;gap:4px;min-width:0;margin:0 0 4px}
  .snippet-desc .snippet-label{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .snippet-label-input{display:block;width:auto;font-size:10px;font-weight:700;letter-spacing:.045em;padding:2px 5px;margin:0}
  .snippet-desc .label-btn{width:20px;height:20px;font-size:12px}
  .snippet-body{display:grid;gap:10px}
  textarea{height:34px;min-height:34px;resize:vertical;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .output-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
  .output{min-height:34px;padding:7px 8px;border-radius:6px;background:var(--code);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .missing{color:var(--danger);background:var(--danger-soft);border-radius:3px}
  /* Template highlighting: a backdrop behind the transparent textarea mirrors its text, with each {{variable}} wrapped in a mark. */
  .tpl-wrap{position:relative;border-radius:6px;background:var(--panel)}
  .tpl-wrap:has(textarea:disabled){background:var(--code)}
  .tpl-wrap textarea,.tpl-wrap textarea:disabled{position:relative;display:block;background:transparent}
  .tpl-backdrop{position:absolute;inset:0;overflow:hidden;pointer-events:none;padding:7px 8px;border:1px solid transparent;color:transparent;white-space:pre-wrap;overflow-wrap:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tpl-backdrop mark{color:transparent;background:none;border-radius:3px}
  /* Colour coding appears only on the snippet that was last clicked. */
  .snippet.is-active,.prompt-section.is-active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .snippet.is-active .tpl-backdrop mark,.snippet.is-active .interp,.prompt-section.is-active .interp{background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:inset 0 -1.5px color-mix(in srgb,var(--c) 55%,transparent);border-radius:3px}
  .var-card.used{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
  .no-highlight .snippet.is-active,.no-highlight .prompt-section.is-active{border-color:var(--line);box-shadow:none}
  .no-highlight .snippet.is-active .tpl-backdrop mark,.no-highlight .snippet.is-active .interp,.no-highlight .prompt-section.is-active .interp{background:none;box-shadow:none}
  .no-highlight .var-card.used{border-color:var(--line);box-shadow:none}
  .var-card.fixed-var{grid-template-columns:minmax(0,2fr) auto minmax(0,3fr)}
  .var-color{height:30px;padding:2px 3px;cursor:pointer}
  .setting-row{display:flex;align-items:center;gap:14px}
  .switch{position:relative;flex:none;width:36px;height:20px;padding:0;border:0;border-radius:999px;background:var(--line-strong)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);transition:transform .15s}
  .switch[aria-checked]:hover{background:var(--line-strong)}
  .switch[aria-checked="true"],.switch[aria-checked="true"]:hover{background:var(--accent)}
  .switch[aria-checked="true"]::after{transform:translateX(16px)}
  .status{color:var(--muted);font-size:11px;margin-top:3px}
  .status:empty{display:none}
  .empty{color:var(--muted);font-size:13px;padding:7px 2px}
  .palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .palette-option{display:grid;gap:9px;padding:12px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px}
  .palette-option:hover{background:var(--bg);border-color:var(--line-strong)}
  .palette-option[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .palette-name{display:flex;align-items:center;justify-content:space-between;font-weight:650}
  .palette-check{color:var(--accent);visibility:hidden}
  .palette-option[aria-pressed="true"] .palette-check{visibility:visible}
  .palette-sample{color:var(--highlight);font-size:13px;font-weight:650}
  .palette-swatches{display:flex;gap:4px}
  .palette-swatches span{width:20px;height:20px;border-radius:6px;border:1px solid var(--line)}
  /* Custom palettes store only base colours; the rest are mixed from them. */
  [data-palette^="custom-"]{
    --hover:color-mix(in srgb,var(--panel) 96%,var(--ink)); --line-strong:color-mix(in srgb,var(--line) 60%,var(--ink));
    --accent-hover:color-mix(in srgb,var(--accent) 82%,#000); --accent-soft:color-mix(in srgb,var(--accent) 10%,var(--panel));
    --accent-line:color-mix(in srgb,var(--accent) 22%,var(--panel)); --accent-ink:color-mix(in srgb,var(--accent) 80%,var(--ink));
    --on-accent:#fff; --focus:color-mix(in srgb,var(--accent) 22%,transparent); --danger-soft:color-mix(in srgb,var(--danger) 12%,var(--panel));
    --code:color-mix(in srgb,var(--bg) 50%,var(--panel)); --shadow:0 2px 10px #0000000d; --shadow-lg:0 6px 24px #00000024;
  }
  .palette-card{position:relative;display:grid}
  .palette-actions{position:absolute;right:6px;bottom:8px;display:flex;gap:1px}
  .palette-actions .icon-btn{width:24px;height:24px;font-size:14px;color:var(--muted);border-color:transparent;background:transparent}
  .palette-actions .icon-btn:hover{color:var(--ink);border-color:var(--line);background:var(--panel)}
  .palette-actions .delete-palette:hover{color:var(--danger)}
  .palette-add{place-content:center;justify-items:center;gap:6px;color:var(--muted);border-style:dashed;font-weight:650}
  .palette-add .ico{font-size:20px}
  .palette-add:hover,.palette-add[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);box-shadow:none}
  .palette-form-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .palette-form-foot .palette-option{min-width:230px}
  .palette-form-actions{display:flex;gap:7px}
  .section-head button{flex:none;white-space:nowrap}
  .prompt{margin:0;max-height:340px;overflow:auto;padding:10px 12px;background:var(--code);border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .about dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0 0}
  .about dt{color:var(--muted)}
  .about dd{margin:0}
  .about p{margin:0}
  .workspace-empty{background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px;padding:35px 20px;text-align:center;color:var(--muted)}
  .workspace-empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s;box-shadow:var(--shadow-lg);z-index:5}
  .toast.show{opacity:1}
  @media(max-width:760px){
    .app-header{padding:16px}.layout{grid-template-columns:minmax(0,1fr);padding:13px;gap:13px}
    .side-col{position:static}.workspace-list{max-height:none}
    .workspace-toolbar{align-items:flex-start;flex-direction:column}
    /* Like single-line inputs: no wrapping, overflow scrolls out of view without a scrollbar. */
    .tpl-wrap textarea,.tpl-backdrop,.output{white-space:pre;overflow-wrap:normal}
    .tpl-wrap textarea,.output{overflow-x:auto;scrollbar-width:none}
    .tpl-wrap textarea::-webkit-scrollbar,.output::-webkit-scrollbar{display:none}
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>VarPad</h1>
    <p id="tagline" class="tagline">One tweak. Every snippet.</p>
    <p class="description">A little workspace for reusable, variable-powered text. Set your values, watch your snippets update, and copy what you need.</p>
  </div>
</header>

<div class="layout">
  <div class="side-col">
  <div class="zen-row"><button id="zenButton" class="icon-btn zen-btn" type="button" title="Zen mode" aria-label="Zen mode" aria-pressed="false"></button></div>
  <aside class="sidebar" aria-label="Workspace collection">
    <div class="side-head">
      <div class="side-title"><button id="settingsButton" class="icon-btn settings-btn" type="button" title="Settings" aria-label="Settings" aria-pressed="false"></button><h2 id="sidebarTitle">Workspaces</h2></div>
      <div id="sideActions" class="side-actions"><button id="addWorkspace" class="primary icon-btn" type="button" title="New workspace" aria-label="New workspace"></button><button id="workspacesMore" class="icon-btn workspace-more" type="button" data-menu-for="*" aria-haspopup="menu" aria-expanded="false" title="All workspaces actions" aria-label="All workspaces actions"></button></div>
    </div>
    <nav id="workspaceList" class="workspace-list" aria-label="Saved workspaces"></nav>
  </aside>
  </div>

  <main id="workspaceView" class="main"></main>
</div>
<div id="workspaceMenu" class="menu" role="menu" hidden></div>
<input id="importFile" type="file" accept=".json,application/json" multiple hidden>
<input id="paletteImportFile" type="file" accept=".json,application/json" hidden>
<div id="varSuggest" class="menu suggest" role="listbox" aria-label="Variables" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const STORAGE_KEY = "varpad-workspaces-v2";
  const TAGLINES = [
    "One tweak. Every snippet.",
    "When you're lazy, and careful.",
    "Alt+Tab, Copy..., Alt+Tab, Paste..., Alt+Tab, Copy..., Alt+Tab, paste...",
    "Set it. Snip it. Copy it.",
    "Write once. Fill everywhere.",
    "Live templates. Ready-to-copy text.",
    "Reusable snippets, powered by variables.",
    "A scratchpad for parameterized text.",
    "Mix your values. Make your snippets.",
    "A playground for reusable text.",
    "Less typing. More doing.",
    "Type a value. Watch it spread.",
    "What you type is what you copy.",
    "[un]Mad Libs for your terminal."
  ];
  // Icon paths from Lucide (lucide.dev, ISC license).
  const ICONS = {
    plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
    trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    unlock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
    copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',

      :menuWorkspaceId==="palettes"?["Palette actions",item("export-palettes","braces","Export all")]
      :["Workspace actions",item("export-json","braces","Export")];
    m.setAttribute("aria-label",label);m.innerHTML=items;
    m.hidden=false;btn.setAttribute("aria-expanded","true");
    m.style.top=`${r.bottom+4}px`;m.style.left=`${Math.max(8,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-8))}px`;
    m.querySelector("button").focus();
  }
  function closeMenu(){
    if($("workspaceMenu").hidden)return;
    $("workspaceMenu").hidden=true;menuWorkspaceId=null;
    document.querySelectorAll('.workspace-more[aria-expanded="true"]').forEach(b=>b.setAttribute("aria-expanded","false"));
  }
  $("workspaceMenu").addEventListener("click",e=>{
    const action=e.target.closest("[data-action]")?.dataset.action,w=state.workspaces.find(x=>x.id===menuWorkspaceId);
    closeMenu();if(action==="export-palettes")exportAllPalettes();else if(action==="import")$("importFile").click();else if(action==="export-all")exportAll();else if(action==="export-json"&&w)exportJson(w);
  });
  document.addEventListener("click",e=>{if(!e.target.closest("#workspaceMenu,.workspace-more"))closeMenu()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
  window.addEventListener("resize",closeMenu);
  window.addEventListener("resize",hideSuggest);
  window.addEventListener("scroll",e=>{if(suggest&&e.target!==$("varSuggest"))updateSuggest(suggest.ta)},true);
  $("varSuggest").addEventListener("mousedown",e=>e.preventDefault());
  $("varSuggest").addEventListener("click",e=>{const o=e.target.closest("[data-i]");if(o&&suggest)chooseSuggest(Number(o.dataset.i))});
  $("workspaceList").addEventListener("scroll",closeMenu);
  // Clicking a snippet colour-codes it; clicking a variable keeps the current one so its values can be edited.
  const activateFrom=e=>{
    const sn=e.target.closest?.(".snippet");if(sn)setActiveSnippet(sn.dataset.snippetId);else if(!e.target.closest?.(".var-card"))setActiveSnippet(null);
    const pr=$("promptSection");if(!pr||e.target.closest?.("#useCaseCard"))return;
    const on=pr.contains(e.target);pr.classList.toggle("is-active",on);$("useCaseCard").classList.toggle("used",on);
  };
  document.addEventListener("pointerdown",activateFrom);
  document.addEventListener("focusin",activateFrom);
  $("paletteImportFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)importPaletteFile(f)});
  $("importFile").addEventListener("change",e=>{const files=[...e.target.files];e.target.value="";if(files.length)importFiles(files)});
  $("workspacesMore").addEventListener("click",e=>{const open=menuWorkspaceId==="*";closeMenu();if(!open)openMenu(e.currentTarget)});
  $("workspaceList").addEventListener("click",e=>{
    const del=e.target.closest("[data-delete-workspace]");
    if(del){
      const i=state.workspaces.findIndex(x=>x.id===del.dataset.deleteWorkspace);if(i<0)return;
      const [gone]=state.workspaces.splice(i,1);closeMenu();
      if(state.activeId===gone.id)state.activeId=(state.workspaces[i]||state.workspaces[i-1])?.id||null;
      render();toast(`Workspace "${gone.name}" deleted.`);return;
    }
    const more=e.target.closest(".workspace-more");
    if(more){const open=menuWorkspaceId===more.dataset.menuFor;closeMenu();if(!open)openMenu(more);return}
    const setting=e.target.closest("[data-setting-id]");
    if(setting){activeSetting=setting.dataset.settingId;render();return}
    const b=e.target.closest("[data-workspace-id]");if(!b)return;
    const w=state.workspaces.find(x=>x.id===b.dataset.workspaceId);if(!w)return;
    state.activeId=w.id;render();
  });
  let zen=false;
  function setZen(on){
    zen=on;document.activeElement?.blur();closeMenu();
    if(on&&settingsOpen){settingsOpen=false;render()}
    if(!on)showTagline();
    document.body.classList.toggle("zen",on);$("zenButton").setAttribute("aria-pressed",String(on));
    try{localStorage.setItem("varpad-zen",on?"1":"0")}catch(_){}
  }
  $("zenButton").addEventListener("click",()=>setZen(!zen));
  render();
  let savedZen=false;
  try{savedZen=localStorage.getItem("varpad-zen")==="1"}catch(_){}
  setZen(savedZen);
})();
</script>
</body>
</html>
